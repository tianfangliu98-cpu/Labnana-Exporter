name: 报告问题
description: 导出失败、面板不显示、字段缺失、压缩包异常等
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量把下面填完整 —— 尤其是日志部分，没有日志基本只能靠猜。

        提之前先扫一眼 README 的「常见问题」，登录失效、参考图 `Failed to fetch`、
        提示词为空这几类在那里都有答案。

  - type: input
    id: browser
    attributes:
      label: 浏览器与版本
      description: 打开「关于」页面能看到，例如 Chrome 131、Edge 126、Vivaldi 7.0
      placeholder: Chrome 131
    validations:
      required: true

  - type: input
    id: ext-version
    attributes:
      label: 扩展版本
      description: 在 chrome://extensions 里能看到，或查看 manifest.json 的 version 字段
      placeholder: "1.9.0"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 出问题的环节
      options:
        - 面板没出现 / 界面显示异常
        - 列表载入失败或数量不对
        - 导出中途停止
        - 提示词、参数为空或不正确
        - 参考图下载失败
        - 压缩包打不开 / 内容缺失
        - 其他
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 现象与复现步骤
      description: 你做了什么、期望什么、实际发生了什么
      placeholder: |
        1. 打开作品页，点「全部载入」
        2. 载入到 240 件就停了，提示已达上限
        3. 再点一次没有继续
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 面板日志 / errorlog.txt
      description: |
        面板底部日志区可以全选复制；如果导出包里生成了 `errorlog.txt`，把它拖进来更好。

        **请先删掉令牌、cookie、作品 ID 等隐私内容。**
      render: text
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 这是导出**自己**作品时遇到的问题
          required: true
        - label: 已确认扩展是最新版本（对比 manifest.json 的 version）
          required: true
